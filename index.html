<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우주 고양이 대형 타이머</title>
  <style>
    /* GS혜자로운체 웹폰트 로드 (눈누 CDN) */
    @font-face {
      font-family: 'GSHyejaroun';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2410-1@1.0/GSHyejaroun.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'GSHyejaroun', 'Jua', sans-serif;
    }

    body {
      background-color: #0b112c;
      background-image: 
        radial-gradient(2px 2px at 20px 30px, #ffd700, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 40px 70px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 90px 40px, #38bdf8, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 160px 120px, #ffd700, rgba(0,0,0,0)),
        radial-gradient(1.5px 1.5px at 230px 190px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 300px 80px, #f472b6, rgba(0,0,0,0));
      background-repeat: repeat;
      background-size: 350px 250px;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      user-select: none;
      position: relative;
      overflow-x: hidden;
    }

    /* 우주 데코 요소 (SVG) */
    .space-decor {
      position: absolute;
      pointer-events: none;
      opacity: 0.85;
    }

    .planet-1 {
      top: 5%;
      left: 5%;
      width: 70px;
      height: 70px;
      animation: float 6s ease-in-out infinite alternate;
    }

    .planet-2 {
      bottom: 8%;
      right: 6%;
      width: 90px;
      height: 90px;
      animation: float 8s ease-in-out infinite alternate-reverse;
    }

    .ufo {
      top: 10%;
      right: 8%;
      width: 85px;
      animation: drift 12s linear infinite;
    }

    @keyframes float {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-15px) rotate(10deg); }
    }

    @keyframes drift {
      0% { transform: translateX(0) translateY(0); }
      50% { transform: translateX(-30px) translateY(15px); }
      100% { transform: translateX(0) translateY(0); }
    }

    /* 컨테이너 */
    .container {
      width: 100%;
      max-width: 820px;
      background: rgba(19, 31, 74, 0.9);
      border-radius: 2.5rem;
      padding: 2.5rem 2rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 30px rgba(56, 189, 248, 0.25);
      border: 4px solid #2563eb;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 1.8rem;
      position: relative;
      z-index: 10;
      backdrop-filter: blur(8px);
    }

    /* 상단 헤더 & 고양이 우주비행사 */
    .header-box {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
    }

    .cat-avatar {
      font-size: 2.8rem;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
      animation: bounce 2s infinite alternate;
    }

    h1 {
      font-size: 2.3rem;
      color: #38bdf8;
      letter-spacing: 0.05em;
      text-shadow: 
        3px 3px 0px #0369a1,
        -2px -2px 0px #0369a1,
        2px -2px 0px #0369a1,
        -2px 2px 0px #0369a1,
        0px 4px 10px rgba(0,0,0,0.5);
    }

    /* 타이머 디지털 전광판 디스플레이 */
    .timer-display {
      font-size: clamp(4.5rem, 18vw, 11rem);
      line-height: 1.05;
      font-variant-numeric: tabular-nums;
      color: #fef08a;
      text-shadow: 
        4px 4px 0px #ca8a04,
        -3px -3px 0px #ca8a04,
        3px -3px 0px #ca8a04,
        -3px 3px 0px #ca8a04,
        0px 8px 30px rgba(250, 204, 21, 0.5);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      margin: 0.3rem 0;
      letter-spacing: 0.02em;
    }

    /* 마지막 10초 경고 모드 */
    .timer-display.warning {
      color: #ff4d4d;
      text-shadow: 
        4px 4px 0px #990000,
        -3px -3px 0px #990000,
        3px -3px 0px #990000,
        -3px 3px 0px #990000,
        0px 10px 40px rgba(255, 77, 77, 0.8);
      animation: pulse 0.7s infinite alternate;
    }

    /* 시간 종료 상태 */
    .timer-display.finished {
      color: #38bdf8;
      font-size: clamp(3.2rem, 13vw, 7.5rem);
      text-shadow: 
        4px 4px 0px #0369a1,
        -3px -3px 0px #0369a1,
        3px -3px 0px #0369a1,
        -3px 3px 0px #0369a1,
        0px 10px 30px rgba(56, 189, 248, 0.7);
      animation: bounce 0.5s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.05); }
    }

    @keyframes bounce {
      0% { transform: translateY(0); }
      100% { transform: translateY(-12px); }
    }

    /* 빠른 선택 버튼 그룹 */
    .preset-group {
      display: flex;
      justify-content: center;
      gap: 0.85rem;
      flex-wrap: wrap;
    }

    .btn-preset {
      background: #1e3a8a;
      color: #ffffff;
      border: 3px solid #60a5fa;
      padding: 0.75rem 1.4rem;
      font-size: 1.35rem;
      border-radius: 1.25rem;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 5px 0px #172554;
    }

    .btn-preset:hover {
      background-color: #2563eb;
      transform: translateY(-3px);
      box-shadow: 0 8px 0px #172554;
    }

    .btn-preset:active {
      transform: translateY(2px);
      box-shadow: 0 3px 0px #172554;
    }

    /* 수동 입력 상자 및 대형 보라색 적용 버튼 */
    .input-group {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
      background: rgba(15, 23, 42, 0.8);
      padding: 1.1rem 1.5rem;
      border-radius: 1.6rem;
      border: 3px solid #3b82f6;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
    }

    .time-input-wrap {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .input-group label {
      font-size: 1.4rem;
      color: #93c5fd;
      text-shadow: 1px 1px 0 #1e3a8a;
    }

    .input-group input {
      width: 95px;
      background-color: #090d16;
      border: 3px solid #60a5fa;
      color: #ffffff;
      font-size: 1.6rem;
      padding: 0.5rem;
      border-radius: 1rem;
      text-align: center;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-group input:focus {
      border-color: #c084fc;
      box-shadow: 0 0 15px rgba(192, 132, 252, 0.6);
    }

    /* 보라색 로켓 대형 적용 버튼 */
    .btn-apply {
      background: linear-gradient(135deg, #a855f7 0%, #7e22ce 100%);
      color: #ffffff;
      border: 3px solid #f3e8ff;
      font-size: 1.5rem;
      padding: 0.75rem 2rem;
      border-radius: 1.25rem;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 6px 0px #581c87, 0 10px 20px rgba(168, 85, 247, 0.4);
      text-shadow: 2px 2px 0px #581c87;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .btn-apply:hover {
      background: linear-gradient(135deg, #c084fc 0%, #9333ea 100%);
      transform: translateY(-3px);
      box-shadow: 0 9px 0px #581c87, 0 14px 24px rgba(168, 85, 247, 0.6);
    }

    .btn-apply:active {
      transform: translateY(3px);
      box-shadow: 0 3px 0px #581c87;
    }

    /* 주요 실행 버튼 (시작, 일시정지, 초기화) */
    .control-group {
      display: flex;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .btn-main {
      flex: 1;
      min-width: 140px;
      max-width: 220px;
      padding: 1.1rem 1.5rem;
      font-size: 1.6rem;
      border-radius: 1.5rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-start {
      background-color: #10b981;
      color: #ffffff;
      border: 3px solid #6ee7b7;
      box-shadow: 0 6px 0px #047857;
      text-shadow: 2px 2px 0px #047857;
    }

    .btn-start:hover {
      background-color: #059669;
      transform: translateY(-3px);
      box-shadow: 0 9px 0px #047857;
    }

    .btn-pause {
      background-color: #f59e0b;
      color: #ffffff;
      border: 3px solid #fde047;
      box-shadow: 0 6px 0px #b45309;
      text-shadow: 2px 2px 0px #b45309;
    }

    .btn-pause:hover {
      background-color: #d97706;
      transform: translateY(-3px);
      box-shadow: 0 9px 0px #b45309;
    }

    .btn-reset {
      background-color: #64748b;
      color: #ffffff;
      border: 3px solid #cbd5e1;
      box-shadow: 0 6px 0px #334155;
      text-shadow: 2px 2px 0px #334155;
    }

    .btn-reset:hover {
      background-color: #475569;
      transform: translateY(-3px);
      box-shadow: 0 9px 0px #334155;
    }

    .btn-main:active {
      transform: translateY(3px);
      box-shadow: 0 3px 0px rgba(0,0,0,0.4);
    }

    /* 모바일 가독성 대응 */
    @media (max-width: 600px) {
      .container {
        padding: 1.5rem 1rem;
        gap: 1.4rem;
      }
      .planet-1, .planet-2, .ufo {
        display: none;
      }
      .btn-preset {
        padding: 0.5rem 0.9rem;
        font-size: 1.1rem;
      }
      .btn-apply {
        font-size: 1.25rem;
        padding: 0.6rem 1.4rem;
      }
      .btn-main {
        padding: 0.8rem 1rem;
        font-size: 1.3rem;
        min-width: 95px;
      }
    }
  </style>
</head>
<body>

  <!-- 우주 장식 행성 SVG -->
  <svg class="space-decor planet-1" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="35" fill="#f43f5e"/>
    <ellipse cx="50" cy="50" rx="48" ry="12" fill="none" stroke="#fbcfe8" stroke-width="5" transform="rotate(-20 50 50)"/>
    <circle cx="38" cy="40" r="6" fill="#be123c"/>
  </svg>

  <svg class="space-decor planet-2" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="40" fill="#38bdf8"/>
    <circle cx="35" cy="35" r="8" fill="#0284c7"/>
    <circle cx="65" cy="55" r="10" fill="#0284c7"/>
  </svg>

  <svg class="space-decor ufo" viewBox="0 0 100 60">
    <ellipse cx="50" cy="35" rx="40" ry="14" fill="#94a3b8"/>
    <ellipse cx="50" cy="25" rx="22" ry="16" fill="#38bdf8" opacity="0.8"/>
    <circle cx="30" cy="36" r="3" fill="#facc15"/>
    <circle cx="50" cy="38" r="3" fill="#facc15"/>
    <circle cx="70" cy="36" r="3" fill="#facc15"/>
  </svg>

  <!-- 메인 타이머 카드 -->
  <div class="container">
    <div class="header-box">
      <span class="cat-avatar">🐱‍🚀</span>
      <h1>우주 탐험 타이머</h1>
    </div>
    
    <!-- 큰 글씨 남은 시간 표시 -->
    <div id="display" class="timer-display">05:00</div>

    <!-- 빠른 선택 버튼 -->
    <div class="preset-group">
      <button class="btn-preset" onclick="setPreset(5)">5분</button>
      <button class="btn-preset" onclick="setPreset(10)">10분</button>
      <button class="btn-preset" onclick="setPreset(15)">15분</button>
      <button class="btn-preset" onclick="setPreset(30)">30분</button>
    </div>

    <!-- 분/초 수동 입력 및 대형 보라색 적용 버튼 -->
    <div class="input-group">
      <div class="time-input-wrap">
        <input type="number" id="customMinutes" min="0" max="999" value="5">
        <label for="customMinutes">분</label>
      </div>
      <div class="time-input-wrap">
        <input type="number" id="customSeconds" min="0" max="59" value="0">
        <label for="customSeconds">초</label>
      </div>
      <button class="btn-apply" onclick="applyCustomTime()">🚀 적용</button>
    </div>

    <!-- 시작 / 일시정지 / 초기화 독립 버튼 -->
    <div class="control-group">
      <button id="startBtn" class="btn-main btn-start" onclick="startTimer()">시작</button>
      <button id="pauseBtn" class="btn-main btn-pause" onclick="pauseTimer()">일시정지</button>
      <button class="btn-main btn-reset" onclick="resetTimer()">초기화</button>
    </div>
  </div>

  <script>
    // 타이머 상태 데이터
    let totalSeconds = 300; // 기본 5분
    let remainingSeconds = 300;
    let timerInterval = null;
    let isRunning = false;

    // DOM 참조
    const displayEl = document.getElementById('display');
    const customMinutesInput = document.getElementById('customMinutes');
    const customSecondsInput = document.getElementById('customSeconds');

    // 화면 업데이트
    function updateDisplay() {
      if (remainingSeconds <= 0) {
        displayEl.textContent = "시간 종료!";
        displayEl.className = "timer-display finished";
        return;
      }

      const minutes = Math.floor(remainingSeconds / 60);
      const seconds = remainingSeconds % 60;

      const formattedMin = String(minutes).padStart(2, '0');
      const formattedSec = String(seconds).padStart(2, '0');

      displayEl.textContent = `${formattedMin}:${formattedSec}`;

      // 마지막 10초 빨간색 경고
      if (remainingSeconds <= 10) {
        displayEl.className = "timer-display warning";
      } else {
        displayEl.className = "timer-display";
      }
    }

    // 타이머 시작
    function startTimer() {
      if (isRunning || remainingSeconds <= 0) return;

      isRunning = true;

      timerInterval = setInterval(() => {
        remainingSeconds--;
        updateDisplay();

        if (remainingSeconds <= 0) {
          clearInterval(timerInterval);
          timerInterval = null;
          isRunning = false;
          playBeepSound(); // Web Audio API 종료 알림음
        }
      }, 1000);
    }

    // 타이머 일시정지
    function pauseTimer() {
      if (!isRunning) return;
      isRunning = false;
      clearInterval(timerInterval);
      timerInterval = null;
    }

    // 타이머 초기화
    function resetTimer() {
      pauseTimer();
      remainingSeconds = totalSeconds;
      updateDisplay();
    }

    // 빠른 선택
    function setPreset(minutes) {
      customMinutesInput.value = minutes;
      customSecondsInput.value = 0;
      applyCustomTime();
    }

    // 입력 시간 적용
    function applyCustomTime() {
      pauseTimer();

      let min = parseInt(customMinutesInput.value, 10);
      let sec = parseInt(customSecondsInput.value, 10);

      if (isNaN(min) || min < 0) min = 0;
      if (isNaN(sec) || sec < 0) sec = 0;

      if (sec >= 60) {
        min += Math.floor(sec / 60);
        sec = sec % 60;
      }

      customMinutesInput.value = min;
      customSecondsInput.value = sec;

      totalSeconds = (min * 60) + sec;
      remainingSeconds = totalSeconds;
      
      updateDisplay();
    }

    // Web Audio API를 활용한 알림음
    function playBeepSound() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();

        const beepTimes = [0, 0.25, 0.5];
        
        beepTimes.forEach(timeOffset => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, ctx.currentTime + timeOffset); // A5 음높이

          gain.gain.setValueAtTime(0.4, ctx.currentTime + timeOffset);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + timeOffset + 0.2);

          osc.connect(gain);
          gain.connect(ctx.destination);

          osc.start(ctx.currentTime + timeOffset);
          osc.stop(ctx.currentTime + timeOffset + 0.2);
        });
      } catch (e) {
        console.error("Audio error:", e);
      }
    }

    // 최초 렌더링
    updateDisplay();
  </script>
</body>
</html>
